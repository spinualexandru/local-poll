<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>LocalPoll</title>
  </head>
  <body>
    <main>
      <div class="sidebar">
        <div class="sidebar--top">
          <img src="/logo.png" alt="Logo" class="logo" width="48" />
        </div>
        <div class="sidebar--middle">
          <a href="/" class="sidebar-icon" title="Home">
            <img src="/icons/home.png" alt="Home" width="32" />
          </a>
          <a href="/poll/create" class="sidebar-icon" title="New Poll">
            <img src="/icons/new.png" alt="New" width="32" />
          </a>
        </div>
        <div class="sidebar--bottom">
          <a href="https://github.com/spinualexandru/local-poll" target="_blank" rel="noopener noreferrer" class="sidebar-icon" title="GitHub">
            <img src="/icons/git.png" alt="GitHub" width="32" />
          </a>
        </div>
      </div>
      <div class="content">{{content}}</div>
    </main>
  </body>
</html>
