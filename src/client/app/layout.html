<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="/components/index.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/components/index.mjs"></script>
    <title>LocalPoll</title>
  </head>
  <body>
    <lp-layout variant="{{layoutVariant}}">
      <main>
        <lp-sidebar variant="public">
          <aside aria-label="LocalPoll sidebar">
            <nav aria-label="Primary navigation">
              <div class="sidebar-top">
                <a class="public-brand" href="/" aria-label="LocalPoll home">
                  <img src="/logo.png" alt="" width="48" />
                  <span>LocalPoll</span>
                </a>
              </div>
              <div class="sidebar-middle">
                <lp-sidebar-item>
                  <a href="/" title="Home">
                    <svg
                      class="public-nav-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path d="M3 10.5 12 3l9 7.5" />
                      <path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7" />
                    </svg>
                    <span>Home</span>
                  </a>
                </lp-sidebar-item>
                <lp-sidebar-item>
                  <a href="/poll/create" title="New Poll">
                    <svg
                      class="public-nav-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path d="M12 5v14M5 12h14" />
                    </svg>
                    <span>New poll</span>
                  </a>
                </lp-sidebar-item>
              </div>
              <div class="sidebar-bottom">
                <lp-sidebar-item>
                  <a
                    href="https://github.com/spinualexandru/local-poll"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="GitHub"
                  >
                    <svg
                      class="public-nav-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7.4A5.8 5.8 0 0 0 19.3 3 5.4 5.4 0 0 0 19.1 0S17.9-.4 15 1.5a14 14 0 0 0-6 0C6.1-.4 4.9 0 4.9 0a5.4 5.4 0 0 0-.2 3A5.8 5.8 0 0 0 3.2 7.1c0 5.8 3.5 7 6.8 7.4A4.8 4.8 0 0 0 9 18v4"
                      />
                      <path d="M9 19c-3 .9-3-1.5-4.2-2" />
                    </svg>
                    <span>GitHub</span>
                  </a>
                </lp-sidebar-item>
              </div>
            </nav>
          </aside>
        </lp-sidebar>
        <section class="public-content" aria-label="Page content">
          {{content}}
        </section>
      </main>
    </lp-layout>
  </body>
</html>
