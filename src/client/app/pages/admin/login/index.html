<div class="auth-form-wrap">
  <div class="auth-intro">
    <p class="auth-eyebrow">LocalPoll admin</p>
    <h1>Welcome<br />back</h1>
    <p>Sign in to customize and manage your LocalPoll instance.</p>
  </div>

  <lp-form layout="stack">
    <form class="auth-form" action="/admin/login" method="post">
      <lp-text-field>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          value="{{email}}"
          autocomplete="email"
          maxlength="254"
          required
          autofocus
        />
      </lp-text-field>

      <lp-text-field>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </lp-text-field>

      <p class="form-error" role="alert">{{error}}</p>
      <lp-button variant="primary" size="large" block>
        <button type="submit">Sign in</button>
      </lp-button>
    </form>
  </lp-form>
</div>
