<div class="auth-form-wrap">
  <div class="auth-intro">
    <p class="auth-eyebrow">LocalPoll admin</p>
    <h1>First-time<br />setup</h1>
    <p>
      Your localpoll instance needs an admin account, let’s go ahead and set it
      up.
    </p>
  </div>

  <lp-form layout="stack">
    <form class="auth-form" action="/admin/setup" method="post">
      <lp-text-field>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          value="{{email}}"
          autocomplete="email"
          maxlength="254"
          required
          autofocus
        />
      </lp-text-field>

      <lp-text-field>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="11"
          required
        />
        <p data-hint>
          Use at least 11 characters with one special character.
        </p>
      </lp-text-field>

      <p class="form-error" role="alert">{{error}}</p>
      <lp-button variant="primary" size="large" block>
        <button type="submit">Complete</button>
      </lp-button>
    </form>
  </lp-form>
</div>
