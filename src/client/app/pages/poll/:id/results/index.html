<div id="results-container">
  <h1 id="pollQuestion"></h1>
  <p id="total-votes"></p>
  <div id="results-list"></div>
  <div id="actions-container">
    <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
    <button id="share-btn" class="btn btn-primary">Share Poll</button>
  </div>
</div>

<script type="module">
  import { getPollById } from "/services/poll.mjs";
  import { getVotesByPollId } from "/services/vote.mjs";

  const pollId = "{{dynamicParams.id}}";

  const createResultRow = (optionName, voteCount, percentage) => {
    const row = document.createElement("div");
    row.className = "result-row";

    const header = document.createElement("div");
    header.className = "result-header";

    const name = document.createElement("span");
    name.className = "option-name";
    name.textContent = optionName;

    const count = document.createElement("span");
    count.className = "vote-count";
    count.textContent = `${voteCount} vote${voteCount !== 1 ? "s" : ""} (${percentage}%)`;

    header.appendChild(name);
    header.appendChild(count);

    const progressBar = document.createElement("div");
    progressBar.className = "progress-bar";

    const progressFill = document.createElement("div");
    progressFill.className = "progress-fill";
    progressFill.style.width = `${percentage}%`;

    progressBar.appendChild(progressFill);

    row.appendChild(header);
    row.appendChild(progressBar);

    return row;
  };

  getPollById(pollId)
    .then((pollResult) => {
      if (!pollResult.success || !pollResult.data) {
        document.getElementById("pollQuestion").textContent = "Poll not found";
        return;
      }

      const poll = pollResult.data;
      document.getElementById("pollQuestion").textContent = poll.question;

      getVotesByPollId(pollId)
        .then((votesResult) => {
          const resultsList = document.getElementById("results-list");
          const totalVotesElem = document.getElementById("total-votes");
          resultsList.innerHTML = "";

          const votes = votesResult.data || [];
          const totalVotes = votes.length;

          // Count votes per option
          const voteCounts = votes.reduce((acc, vote) => {
            acc[vote.option_id] = (acc[vote.option_id] || 0) + 1;
            return acc;
          }, {});

          totalVotesElem.textContent = `${totalVotes} total vote${totalVotes !== 1 ? "s" : ""}`;

          // Display all options (even those with 0 votes)
          poll.options.forEach((optionName, index) => {
            const count = voteCounts[index] || 0;
            const percentage = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
            const row = createResultRow(optionName, count, percentage);
            resultsList.appendChild(row);
          });
        })
        .catch((error) => {
          console.error("Error fetching votes:", error);
        });
    })
    .catch((error) => {
      console.error("Error fetching poll:", error);
      document.getElementById("pollQuestion").textContent = "Error loading poll";
    });

  // Refresh button - reload the page
  document.getElementById("refresh-btn").addEventListener("click", () => {
    window.location.reload();
  });

  // Share button - copy poll voting URL to clipboard
  document.getElementById("share-btn").addEventListener("click", async () => {
    const pollUrl = `${window.location.origin}/poll/${pollId}`;
    const shareBtn = document.getElementById("share-btn");

    try {
      await navigator.clipboard.writeText(pollUrl);
      const originalText = shareBtn.textContent;
      shareBtn.textContent = "Copied!";
      setTimeout(() => {
        shareBtn.textContent = originalText;
      }, 2000);
    } catch (error) {
      console.error("Failed to copy:", error);
      alert("Failed to copy URL to clipboard");
    }
  });
</script>

<style>
  #results-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 24px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #pollQuestion {
    font-size: 42px;
    color: var(--secondary-color);
    margin-bottom: 8px;
    text-align: center;
  }

  #total-votes {
    font-size: 16px;
    color: #666;
    text-align: center;
    margin-bottom: 32px;
  }

  #results-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .result-row {
    background: white;
    border: 2px solid var(--secondary-color);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 4px 4px 0px 0px var(--secondary-color);
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .option-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--secondary-color);
  }

  .vote-count {
    font-size: 14px;
    color: #666;
    font-weight: 500;
  }

  .progress-bar {
    height: 12px;
    background: #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary-color);
    border-radius: 6px;
    transition: width 0.3s ease;
  }

  #actions-container {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  .btn {
    height: 44px;
    padding: 0 24px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: "Quicksand", sans-serif;
    transition: filter 0.2s ease;
  }

  .btn:hover {
    filter: brightness(0.95);
  }

  .btn-primary {
    background: var(--primary-color);
    color: var(--secondary-color);
    border: none;
    box-shadow: 4px 4px 0px 0px var(--secondary-color);
  }

  .btn-secondary {
    background: white;
    color: var(--secondary-color);
    border: 2px solid var(--secondary-color);
    box-shadow: 4px 4px 0px 0px var(--secondary-color);
  }
</style>
