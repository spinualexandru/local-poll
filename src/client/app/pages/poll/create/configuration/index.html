<section class="poll-builder-page">
  <aside class="poll-preview" aria-label="Poll preview">
    <p>Preview</p>
    <h1>{{escapedQueryParams.question}}</h1>
  </aside>

  <div class="poll-builder-controls">
    <lp-form layout="stack">
      <form action="/poll/create/options" method="get">
        <input
          type="hidden"
          name="question"
          value="{{escapedQueryParams.question}}"
        />
        <h1>Configure the poll</h1>
        <lp-choice-group>
          <fieldset>
            <legend>Choose a poll type</legend>
            <lp-radio>
              <input
                type="radio"
                name="isMultiple"
                value="false"
                id="poll-type-single"
                required
              />
              <label for="poll-type-single">Single Option</label>
            </lp-radio>
            <lp-radio>
              <input
                type="radio"
                name="isMultiple"
                value="true"
                id="poll-type-multiple"
                required
              />
              <label for="poll-type-multiple">Multiple Choice</label>
            </lp-radio>
          </fieldset>
        </lp-choice-group>
        <lp-button variant="primary">
          <button type="submit">Continue</button>
        </lp-button>
      </form>
    </lp-form>
  </div>
</section>
