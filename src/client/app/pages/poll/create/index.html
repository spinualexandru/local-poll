<section class="poll-question-page">
  <lp-form layout="stack" class="poll-question-form">
    <form action="/poll/create/configuration" method="get">
      <h1>What do you want to ask?</h1>
      <lp-text-field>
        <label class="visually-hidden" for="poll-input">Poll question</label>
        <input
          type="text"
          id="poll-input"
          name="question"
          placeholder="Type your question here..."
          required
          autofocus
        />
      </lp-text-field>
      <lp-button variant="primary">
        <button type="submit">Continue</button>
      </lp-button>
    </form>
  </lp-form>
</section>
