<section class="poll-builder-page">
  <aside class="poll-preview poll-ticket" aria-label="Poll preview">
    <p class="page-kicker">Live preview</p>
    <h1>{{escapedQueryParams.question}}</h1>
    <div class="preview-option" aria-hidden="true"><i></i> Option 1</div>
    <div class="preview-option" aria-hidden="true"><i></i> Option 2</div>
    <p class="preview-note">Options update once the poll is created.</p>
  </aside>

  <div class="poll-builder-controls poll-paper">
    <lp-form layout="stack" id="poll-options-form">
      <form>
        <p class="page-kicker">Step 3 of 3 · Answers</p>
        <h1>Add the options</h1>
        <p class="poll-builder-help">Enter at least two choices. You can add more at any time.</p>
        <div class="options-list" id="options-list">
          <div class="option-row">
            <lp-text-field>
              <label class="visually-hidden" for="option-0">Option 1</label>
              <input
                class="option-input"
                id="option-0"
                type="text"
                placeholder="Option 1"
              />
            </lp-text-field>
            <lp-button variant="danger" class="delete-option">
              <button type="button" aria-label="Delete option 1">×</button>
            </lp-button>
          </div>
          <div class="option-row">
            <lp-text-field>
              <label class="visually-hidden" for="option-1">Option 2</label>
              <input
                class="option-input"
                id="option-1"
                type="text"
                placeholder="Option 2"
              />
            </lp-text-field>
            <lp-button variant="danger" class="delete-option">
              <button type="button" aria-label="Delete option 2">×</button>
            </lp-button>
          </div>
        </div>
        <div class="poll-form-error" id="options-error" role="alert"></div>
        <div class="poll-options-actions">
          <lp-button
            variant="secondary"
            appearance="outline"
            size="small"
          >
            <button id="add-option" type="button">+ Add option</button>
          </lp-button>
          <lp-button variant="primary">
            <button type="submit">Create poll <span aria-hidden="true">→</span></button>
          </lp-button>
        </div>
      </form>
    </lp-form>
  </div>
</section>

<template id="option-row-template">
  <div class="option-row">
    <lp-text-field>
      <label class="visually-hidden">Poll option</label>
      <input class="option-input" type="text" />
    </lp-text-field>
    <lp-button variant="danger" class="delete-option">
      <button type="button">×</button>
    </lp-button>
  </div>
</template>

<script type="module" src="/pages/poll-create-options.mjs"></script>
